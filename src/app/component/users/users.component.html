
<div class="row">
    <div class="col-12 text-right mb-4">
        <button 
        routerLink="addUser"
        mat-raised-button color="primary">Add User</button>
    </div>
    <div class="col-md-4">
        <ul class="list-group" *ngIf="usersArr.length > 0; else noUsers">
            <li
            [routerLink]="[user.userId]"
             routerLinkActive="active-user"
            *ngFor="let user of usersArr"
            class="list-group-item">
        {{user.userName}} <small class="badge"
        [ngClass]="{
            'badge-success' : user.isActive,
            'badge-danger' : !user.isActive
        }">
            {{user.isActive ?  'Active' : 'In-Active'}} </small> 
            
            </li>
        </ul>
    </div>
    <div class="col-md-8">
    <router-outlet></router-outlet>
    </div>

     <ng-template #noUsers>
  <div class="alert alert-info">
    No Users Data Available
  </div>
</ng-template>
</div>
